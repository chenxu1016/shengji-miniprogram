{
  "$schema": "https://cli.railway.app/railway.schema.json",
  "build": {
    "builder": "NIXPACKS",
    "buildCommand": "cd backend && npm ci && npx tsc"
  },
  "deploy": {
    "startCommand": "cd backend && node dist/server.js",
    "healthCheckPath": "/",
    "restartPolicyType": "ON_FAILURE",
    "restartPolicyMaxRetries": 10
  }
}
